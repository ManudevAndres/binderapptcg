# Publica la carpeta landing/ en GitHub Pages cada vez que cambia el código.
# Los precios diarios no necesitan publicación: la app los lee directamente del repositorio.
name: Publicar web

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "!landing/app/data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
