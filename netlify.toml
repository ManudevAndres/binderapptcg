# Por si más adelante conectas Netlify a este repositorio en GitHub.
[build]
  publish = "landing"
  # No volver a publicar cuando el único cambio son los precios diarios (los lee la app desde GitHub).
  # En la primera publicación no hay commit anterior con el que comparar: publicar siempre.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)landing/app/data'"
